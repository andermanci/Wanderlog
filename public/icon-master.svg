    <line x1="256" y1="84" x2="256" y2="106"/>
    <line x1="256" y1="406" x2="256" y2="428"/>
    <line x1="84" y1="256" x2="106" y2="256"/>
    <line x1="406" y1="256" x2="428" y2="256"/>
  </g>
  <!-- Aguja -->
  <polygon points="256,136 296,256 256,238 216,256" fill="#fdf6ec"/>
  <polygon points="256,376 216,256 256,274 296,256" fill="#f0b894"/>
  <circle cx="256" cy="256" r="17" fill="#fdf6ec"/>
  <circle cx="256" cy="256" r="7" fill="#96371a"/>
