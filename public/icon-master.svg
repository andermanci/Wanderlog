<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c2602f"/>
      <stop offset="1" stop-color="#96371a"/>
    </linearGradient>
  </defs>
  <!-- Fondo a sangre completa: los launchers aplican su propia máscara -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Brújula -->
